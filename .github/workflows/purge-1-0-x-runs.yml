name: Purge 1.0.x Actions runs

# PAT used by automation often has Contents but not Actions write.
# This workflow uses GITHUB_TOKEN to delete leftover 1.0.x workflow runs
# (and their artifacts) after those git tags and GitHub releases are gone.

on:
  repository_dispatch:
    types: [purge-1-0-x-runs]
  workflow_dispatch:

permissions:
  actions: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Delete 1.0.x workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # First line of the 1.0.x release commits, or the public root
          # commit "Parallel Shelf 1.0.4". Do not match "Stop pinning 1.0.4".
          python3 << 'PY'
          import json, os, re, subprocess, sys

          repo = os.environ["GITHUB_REPOSITORY"]
          title_re = re.compile(r"^(Parallel Shelf )?1\.0\.\d")
          public_root = "2243335758f4f00837f483de2ca6164a4bf8d895"

          def gh_api(path, method="GET"):
              cmd = ["gh", "api", "-X", method, path]
              p = subprocess.run(cmd, capture_output=True, text=True)
              return p.returncode, p.stdout, p.stderr

          runs = []
          page = 1
          while True:
              code, out, err = gh_api(
                  f"repos/{repo}/actions/runs?per_page=100&page={page}"
              )
              if code != 0:
                  print(err, file=sys.stderr)
                  sys.exit(code)
              payload = json.loads(out)
              batch = payload.get("workflow_runs") or []
              runs.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          to_delete = []
          for run in runs:
              title = run.get("display_title") or ""
              sha = run.get("head_sha") or ""
              if title_re.search(title) or sha == public_root:
                  to_delete.append(run)

          print(f"scanned {len(runs)} runs, deleting {len(to_delete)}")
          for run in to_delete:
              rid = run["id"]
              print(f"DELETE {rid} {run.get('name')} {run.get('display_title')}")
              code, out, err = gh_api(
                  f"repos/{repo}/actions/runs/{rid}", method="DELETE"
              )
              if code != 0:
                  print(f"  fail {code} {err.strip()}")
              else:
                  print("  gone")
          PY
