name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Catalog tests
        run: node --test
      - name: Install Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential qt6-base-dev qt6-declarative-dev \
            qt6-declarative-dev-tools qml6-module-qtquick qml6-module-qtquick-window \
            qml6-module-qtqml-workerscript qml6-module-qttest qml6-module-qt-labs-settings \
            qml6-module-qtquick-dialogs qml6-module-qt-labs-platform \
            qml6-module-qt-labs-folderlistmodel \
            qml6-module-qtquick-controls qml6-module-qtquick-templates \
            qml6-module-qtquick-layouts qml6-module-qtmultimedia
      - name: Screen tests
        run: tests/run-ui.sh
